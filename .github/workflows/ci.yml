name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: Install Playwright Chromium for a11y test
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run test:a11y
